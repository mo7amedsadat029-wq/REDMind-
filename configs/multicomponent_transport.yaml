# REDMind v2 Configuration: Multicomponent 2D Nernst-Planck + Donnan Transport (Stage 2)
# Model Version: REDMind-2D-Multicomponent-v2.0
# Primary References:
#   - Gurreri et al. (2017), Desalination, 423, 52-64
#   - Tedesco, Hamelers & Biesheuvel (2016), J. Membr. Sci., 510, 370-381
#   - USGS PHREEQC pitzer.dat (Dw diffusion coefficients at 25 C)
version: "2.0.0"
scenario_group: "multicomponent_brine_scenarios"
random_seed: 2027
n_target_cases: 48
grid:
  nx: 50
  ny: 20

species_order: ["Na", "K", "Mg", "Ca", "Cl", "SO4", "HCO3", "CO3"]

# Tracer diffusion coefficients at 298.15 K (m^2/s) from USGS pitzer.dat / Robinson & Stokes
# Temperature scaling applied via Stokes-Einstein (T / mu_eff(T))
diffusivities_25C_m2_s:
  Na: 1.334e-9
  K: 1.960e-9
  Mg: 0.705e-9
  Ca: 0.792e-9
  Cl: 2.032e-9
  SO4: 1.070e-9
  HCO3: 1.180e-9
  CO3: 0.955e-9

# Intra-membrane diffusivity scaling factors relative to aqueous tracer diffusivity
# Counter-ion monovalent ratio (~0.08 * D_aq ~ 1.07e-10 m2/s) yields membrane ionic
# conductivity sigma_mem = (F^2/RT)*D_ct*|X| ~ 0.80 S/m (at |X|=2000 mol/m3), consistent
# with Fujifilm Type 10 / Neosepta IEM area resistance (~1.3-2.0 Ohm*cm2) and Tedesco et al. (2016).
# Co-ion ratios (~0.0008 * D_aq ~ 1e-12 m2/s) govern Donnan co-ion salt leakage.
membrane_transport_parameters:
  X_cem_mol_m3: -2000.0
  X_aem_mol_m3: 2000.0
  thickness_cem_m: 125.0e-6
  thickness_aem_m: 125.0e-6
  sigma_cem_S_m: 1.0
  sigma_aem_S_m: 1.0
  counterion_monovalent_ratio: 0.08      # ~1.07e-10 m2/s -> sigma_mem ~ 0.8-1.0 S/m
  counterion_divalent_ratio: 0.025       # stronger hydrated-radius retardation for Mg2+/Ca2+/SO4^2-/CO3^2-
  coion_monovalent_ratio: 0.0008         # ~1.0e-12 m2/s -> co-ion leakage consistent with baseline
  coion_divalent_ratio: 0.00025

solver:
  max_coupling_iter: 45
  coupling_tol: 2.0e-4
  relaxation: 0.35
  charge_neutrality_audit_tol: 1.0e-3    # max |sum z_k c_k| / sum |z_k| c_k
