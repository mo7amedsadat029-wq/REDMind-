# REDMind v2 Configuration: Calcite (CaCO3) Saturation-Risk & Heterogeneous Nucleation (Stages 3 & 4)
# References:
#   - Plummer et al. (1988), USGS WRI 88-4153; Parkhurst & Appelo (2013), PHREEQC pitzer.dat
#   - Santoro et al. (2021), Energy 228, 120563 (CNT heterogeneous nucleation framework)
version: "2.0.0"
mineral: "Calcite"
formula: "CaCO3"
activity_model: "Pitzer (Harvie-Moller-Weare / USGS pitzer.dat)"
ksp_source: "USGS pitzer.dat analytical log_K(T) (Ellis 1959 / Plummer & Busenberg 1982)"
molar_volume_cm3_mol: 36.9    # USGS pitzer.dat line 265

# Literature range for calcite-water interfacial energy (Sohnel & Mullin 1982 / Santoro et al. 2021)
cnt_parameters:
  gamma_sl_baseline_J_m2: 0.094
  gamma_sl_sensitivity_range_J_m2: [0.080, 0.105]
  contact_angle_deg_cem_baseline: 55.0
  contact_angle_deg_aem_baseline: 65.0
  contact_angle_sensitivity_range_deg: [35.0, 95.0]
  wenzel_roughness_range: [1.0, 1.8]
  fujifilm_type10_cem_ref:
    source: "PMC6918471 / PMC9864938 (Membranes 2019, 2023)"
    thickness_um: 135.0
    areal_resistance_ohm_cm2: 2.0
    apparent_permselectivity: 0.99
  fujifilm_type10_aem_ref:
    source: "PMC6918471 / PMC9864938 (Membranes 2019, 2023)"
    thickness_um: 125.0
    areal_resistance_ohm_cm2: 1.3
    apparent_permselectivity: 0.92

saturation_regimes:
  undersaturated_max_SI: -0.1
  near_equilibrium_SI_band: [-0.1, 0.1]
  supersaturated_min_SI: 0.1

deposition_model_status: "Thermodynamic saturation and CNT nucleation barrier only; no time-dependent crystal growth kinetics fabricated."
